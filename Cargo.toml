[package]
name = "htmx_four"
version = "0.1.1"
edition = "2024"
description = "Typed htmx 4 config, header names, and official extension settings."
license = "0BSD"
repository = "https://github.com/nilswloewen/htmx_four"
keywords = ["htmx", "hypermedia", "http"]
categories = ["web-programming"]
rust-version = "1.88"

[lib]
path = "src/lib.rs"

[dependencies]
bon = "3.10.3"
http = { version = "1.5.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
strum = { version = "0.28.0", features = ["derive"] }

[features]
# `http::HeaderName` copies of every header name, and `From<http::StatusCode>` for `StatusPattern`.
# Always the latest major version of `http`. A new `http` major is a breaking release of this crate.
http = ["dep:http"]

[package.metadata.docs.rs]
all-features = true
