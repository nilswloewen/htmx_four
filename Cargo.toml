[package]
name = "htmx_four"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Typed htmx 4 config, header names, and official extension settings."
keywords = ["htmx", "hypermedia", "http"]
categories = ["web-programming"]

[lib]
path = "src/lib.rs"

[dependencies]
http = "1.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
strum = { version = "0.28.0", features = ["derive"] }
typed-builder = "0.23.2"
