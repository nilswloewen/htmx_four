[package]
name = "htmx_four"
version = "0.1.3"
edition = "2024"
description = "Typed htmx 4 config, header names, and official extension settings."
license = "0BSD"
repository = "https://github.com/nilswloewen/htmx_four"
keywords = ["htmx", "hypermedia", "http"]
categories = ["web-programming"]
rust-version = "1.88"

[lib]
path = "src/lib.rs"

[dependencies]
bon = "3.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
strum = { version = "0.28.0", features = ["derive"] }
